[project]
name = "constructos-engine"
version = "0.1.0"
description = "ConstructOS Python engine: Gemini agents, layout solving and service routing"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "google-genai>=2.29",
    "ortools>=9.15",
    "networkx>=3.4",
    "shapely>=2.0",
    "reportlab>=4.2",
    "ezdxf>=1.3",
    "google-cloud-firestore>=2.19",
    "google-cloud-storage>=2.18",
    "neuro-san==0.6.77",
    "langchain-google-genai>=4.2.2,<5.0",
    "leaf-common>=1.2.45,<1.2.53",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "httpx2>=2.13.1",
    "pdfplumber>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["constructos_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
